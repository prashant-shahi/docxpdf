# Static SPA from pnpm monorepo (root lockfile + apps/web)
[build]
  command = "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm --dir apps/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version" # prefer corepack/pnpm over npm

# SPA fallback (adapter also emits index.html fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
