# Static SPA — publish SvelteKit adapter-static output
[build]
  command = "corepack enable && cd apps/web && pnpm install && pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (adapter also emits index.html fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
