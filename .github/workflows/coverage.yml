name: Coverage

on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]

jobs:
    frontend:
        name: Frontend
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
            - uses: pnpm/action-setup@v4
              with:
                  version: "10"
                  run_install: false
            - env:
                  CI: true
              run: make coverage-frontend
