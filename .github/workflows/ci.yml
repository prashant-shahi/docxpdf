name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - uses: pnpm/action-setup@v4
              with:
                  version: "10"
                  run_install: false
            - run: make ci-frontend
