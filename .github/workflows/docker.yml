# Build static SPA in CI, pack nginx-only image, push to GHCR.
# Image: ghcr.io/<owner>/<repo>  (e.g. ghcr.io/prashant-shahi/docxpdf)
#
# Uses GITHUB_TOKEN (packages: write). Package must be linked to this repo with
# Actions access Write: Package settings → Manage Actions access.
name: Docker

on:
    push:
        branches: [main, master]
        tags: ["v*"]
    pull_request:
        branches: [main, master]
        paths:
            - "apps/web/**"
            - "packages/engine/**"
            - "Dockerfile"
            - "docker/**"
            - ".dockerignore"
            - "Makefile"
            - "package.json"
            - "pnpm-workspace.yaml"
            - ".github/workflows/docker.yml"

env:
    REGISTRY: ghcr.io

jobs:
    image:
        name: Build image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - uses: pnpm/action-setup@v4
              with:
                  version: "10"
                  run_install: false

            - name: Build static SPA
              run: make build

            - name: Image name (lowercase)
              id: image
              run: |
                  echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            - name: Compute tags
              id: tags
              run: |
                  NAME="${{ steps.image.outputs.name }}"
                  SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
                  TAGS=()
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    TAGS+=("${NAME}:pr-${{ github.event.pull_request.number }}")
                  else
                    TAGS+=("${NAME}:sha-${SHA_SHORT}")
                    if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
                      TAGS+=("${NAME}:latest")
                    fi
                    if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                      TAGS+=("${NAME}:${{ github.ref_name }}")
                      TAGS+=("${NAME}:latest")
                    fi
                  fi
                  # comma-separated for docker tag loop
                  IFS=','; echo "list=${TAGS[*]}" >> "$GITHUB_OUTPUT"
                  echo "primary=${TAGS[0]}" >> "$GITHUB_OUTPUT"
                  printf 'tags:\n'
                  printf '  %s\n' "${TAGS[@]}"

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Classic docker build/push (no Buildx) — more reliable with GHCR
            - name: Build image
              run: |
                  docker build -t "${{ steps.tags.outputs.primary }}" .
                  docker images "${{ steps.image.outputs.name }}"

            - name: Tag and push
              if: github.event_name != 'pull_request'
              run: |
                  PRIMARY="${{ steps.tags.outputs.primary }}"
                  IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.list }}"
                  for tag in "${TAGS[@]}"; do
                    docker tag "$PRIMARY" "$tag"
                    echo "Pushing $tag"
                    docker push "$tag"
                  done
