# Build static SPA, pack nginx-only image, push to GHCR.
# Image: ghcr.io/<owner>/<repo>  (e.g. ghcr.io/prashant-shahi/docxpdf)
#
# - push to main → :latest
# - push git tag v0.1.0 → :v0.1.0
# - pull_request with label build-image → :pr-<number>
#
# Package must be linked to this repo with Actions Write access.
name: Docker

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        types: [labeled, synchronize, reopened]
        branches: [main]

env:
    REGISTRY: ghcr.io

jobs:
    image:
        name: Build image
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'push' ||
            (
              github.event_name == 'pull_request' &&
              (
                contains(github.event.pull_request.labels.*.name, 'build-image') ||
                (github.event.action == 'labeled' && github.event.label.name == 'build-image')
              )
            )
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - uses: pnpm/action-setup@v4
              with:
                  version: "10"
                  run_install: false

            - name: Build static SPA
              run: make build

            - name: Image name (lowercase)
              id: image
              run: |
                  echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            - name: Compute tags
              id: tags
              run: |
                  NAME="${{ steps.image.outputs.name }}"
                  TAGS=()
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    TAGS+=("${NAME}:pr-${{ github.event.pull_request.number }}")
                  elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
                    # git tag v0.1.0 → image tag v0.1.0
                    TAGS+=("${NAME}:${{ github.ref_name }}")
                  else
                    # main → latest only
                    TAGS+=("${NAME}:latest")
                  fi
                  IFS=','; echo "list=${TAGS[*]}" >> "$GITHUB_OUTPUT"
                  echo "primary=${TAGS[0]}" >> "$GITHUB_OUTPUT"
                  printf 'tags:\n'
                  printf '  %s\n' "${TAGS[@]}"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build image
              run: |
                  docker build -t "${{ steps.tags.outputs.primary }}" .
                  docker images "${{ steps.image.outputs.name }}"

            - name: Tag and push
              run: |
                  PRIMARY="${{ steps.tags.outputs.primary }}"
                  IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.list }}"
                  for tag in "${TAGS[@]}"; do
                    docker tag "$PRIMARY" "$tag"
                    echo "Pushing $tag"
                    docker push "$tag"
                  done
