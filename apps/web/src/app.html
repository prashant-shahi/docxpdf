<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DOCxPDF: Free, private, browser-based document editor. Drag, drop, and align text, images, and shapes on a canvas. Export to PDF or DOCX. No account, no server, no tracking."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://docxpdf.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="DOCxPDF — Free Online Document Editor" />
    <meta
      property="og:description"
      content="Drag-and-drop document editor with PDF and DOCX export. No account needed. Zero data leaves your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://docxpdf.com/" />
    <meta
      property="og:image"
      content="https://docxpdf.com/og-image.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DOCxPDF — Free Online Document Editor" />
    <meta
      name="twitter:description"
      content="Drag-and-drop document editor with PDF and DOCX export. No account needed."
    />
    <meta
      name="twitter:image"
      content="https://docxpdf.com/og-image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>DOCxPDF — Free Online Document Editor</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    <meta name="theme-color" content="#e63946" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DOCxPDF" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
