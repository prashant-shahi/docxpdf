<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | DOCxPDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
        }
        .container { text-align: center; max-width: 420px; padding: 0 16px; }
        .code { font-size: 96px; font-weight: 800; color: #1677ff; margin-bottom: 8px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            background: #1677ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover { background: #4096ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Home</a>
    </div>
</body>
</html>
